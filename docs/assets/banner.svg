<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="PromptRegress  Paired statistics, not vibes.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0e1624"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2740" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.45"/>

  <!-- soft accent glow -->
  <ellipse cx="1040" cy="160" rx="280" ry="140" fill="#1d4ed8" opacity="0.18"/>
  <ellipse cx="200" cy="220" rx="220" ry="110" fill="#0f766e" opacity="0.12"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <!-- brand mark: paired bars suggesting baseline vs candidate -->
  <g transform="translate(72, 96)">
    <rect x="0" y="28" width="18" height="72" rx="3" fill="#64748b"/>
    <rect x="28" y="52" width="18" height="48" rx="3" fill="#ef4444"/>
    <path d="M10 18 L46 42" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="10" cy="18" r="4" fill="#94a3b8"/>
    <circle cx="46" cy="42" r="4" fill="#ef4444"/>
  </g>

  <text x="160" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">PromptRegress</text>
  <text x="164" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Paired statistics, not vibes.</text>

  <!-- bottom rule -->
  <rect x="160" y="230" width="220" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
