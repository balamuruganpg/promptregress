[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptregress"
version = "0.6.2"
description = "Regression testing for LLM prompts and models with paired statistics and a CI gate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Balamurugan P G" }]
keywords = ["llm", "prompt", "evaluation", "regression-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
ml = ["sentence-transformers"]

[project.scripts]
promptregress = "promptregress.cli:main"

[project.urls]
Homepage = "https://github.com/balamuruganpg/promptregress"
Source = "https://github.com/balamuruganpg/promptregress"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptregress = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "perf: timing budget for a 1000-case mock comparison with the response cache",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["promptregress"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/promptregress"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
